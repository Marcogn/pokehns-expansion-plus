name: Release

# Publishes a GitHub release whose only asset is a BPS patch against clean
# Pokemon Emerald (USA). The ROM itself is never uploaded. tools/make_patch.sh
# rebuilds the clean base from pret's decompilation and refuses to write a
# patch that does not reproduce the build.
#
# Two ways to start it:
# - Actions -> Release -> Run workflow: pick the branch, type the version.
#   The tag is created by the release itself, on the commit that was built.
# - push a tag v*: the tag name is the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 2.0.6.PLUS.2 (becomes tag v2.0.6.PLUS.2)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 g++

      - name: Cache clean Emerald and Flips
        uses: actions/cache@v4
        with:
          path: ~/.cache/hasep-patch
          # The pins live in the script, so a changed pin is a new cache.
          key: patch-base-${{ hashFiles('tools/make_patch.sh') }}

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME == workflow_dispatch ]]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          # The tag ends up in a file name and a git ref: keep it plain.
          [[ $tag =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "invalid version: $tag"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        # Before the build on purpose: a version without its "## <version>"
        # section in CHANGELOG.md stops here, not after minutes of compiling.
        run: python3 tools/changelog_section.py "$TAG" CHANGELOG.md > changes.md

      - name: ROM (HnS)
        # The title screen shows this version (tools/version_strip.py). It has
        # to be passed: for a manual run the tag does not exist yet.
        run: make hns -j$(nproc) -O HNS_VERSION="$TAG"

      - name: Patch
        run: |
          name="pokemonHnS-plus_${TAG}"
          tools/make_patch.sh pokehns.gba "$name.bps"
          # Uploaded bare: zipping saves only ~6% (measured 18.4 -> 17.2 MB)
          # and costs players an extra step before their patcher.
          echo "PATCH=$name.bps" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat changes.md
            echo
            echo "## How to apply"
            echo
            echo "Apply to a clean **Pokémon Emerald (USA)** ROM,"
            echo "SHA-1 \`f3ae088181bf583e55daf962a92bb46f4f1d07b7\`, with any BPS patcher"
            echo "(Flips, Rom Patcher JS). The result is a 32 MiB ROM."
            echo
            echo "Built from \`${GITHUB_SHA::9}\`."
          } > notes.md
          # --target: for a manual run the tag does not exist yet, and this makes
          # the release create it on the commit that was just built.
          # --generate-notes appends GitHub's changelog: the PRs merged since the
          # previous release, by title. Our notes-file (the CHANGELOG.md section,
          # then how to apply the patch) is prepended to it.
          gh release create "$TAG" "$PATCH" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file notes.md --generate-notes
