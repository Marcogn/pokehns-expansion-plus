name: CI

on:
  push:
    branches:
      - master
      - upcoming
  pull_request:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  # 0, as in the build that produces the delivered ROM: HnS leaves ~40 unused
  # functions and variables behind its IS_HNS switches (15 files), so 1 fails
  # on code nobody calls rather than on anything a change broke.
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  # Hasep ships one ROM, `make hns`. The inherited Emerald/FireRed/LeafGreen/
  # release/test jobs never built it, and all of them were already red on a
  # clean master (CLAUDE.md section 8), so they protected nothing.
  build-hns:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (HnS)
        run: make hns -j$(nproc) -O

      - name: ROM size
        run: |
          # The ROM is padded to 32 MiB, so measure the used part: everything
          # before the trailing run of 0xFF padding. Warn from 98%, fail from
          # 99.5%: megas alone would take it to 99.46% (.claude/rules/megas.md), which
          # must be visible but is still a ROM that fits.
          set -o pipefail  # or tee would hide python's exit code
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          d = open('pokehns.gba', 'rb').read()
          used = len(d.rstrip(b'\xff'))
          pct = 100 * used / len(d)
          msg = f'{used} of {len(d)} bytes used ({pct:.2f}%), {len(d) - used} free'
          if pct >= 99.5:
              print(f'::error::ROM almost full: {msg}')
              sys.exit(1)
          print(f'::warning::ROM above 98%: {msg}' if pct >= 98 else msg)
          PY

  # Gate job: satisfies the "build" branch protection rule.
  build:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [build-hns]
    steps:
      - name: All builds passed
        run: echo "HnS build passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
